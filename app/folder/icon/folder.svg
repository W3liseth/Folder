<svg xmlns="http://www.w3.org/2000/svg" viewBox="98 86 1056 1050">
  <!-- Icône de folder : tuile sombre au bord lumineux multicolore ; dossier en perspective fait
       de feuilles colorées (vert, rouge-orangé avec onglet, jaune) et d'une façade en verre
       bleu (cyan → bleu → violet) avec reflet diagonal, épaisseur visible et bord lumineux.
       Tailles >= 20 px (folder-small.svg en 16 px). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252E3E"/>
      <stop offset="0.5" stop-color="#1A202C"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <linearGradient id="tileSheen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Bord : moitié haute bleu → rouge, moitié basse vert → bleu → jaune-vert ; chaque moitié
         s'éteint vers le milieu des côtés. -->
    <linearGradient id="rimTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#5A55D8"/>
      <stop offset="1" stop-color="#FF3B2F"/>
    </linearGradient>
    <linearGradient id="rimBottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D36A"/>
      <stop offset="0.5" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#C8E83A"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="maskTop" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect x="0" y="60" width="1254" height="560" fill="url(#fadeTop)"/>
    </mask>
    <mask id="maskBottom" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect x="0" y="600" width="1254" height="560" fill="url(#fadeBottom)"/>
    </mask>

    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EDB72"/>
      <stop offset="1" stop-color="#0FA38F"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#E5221C"/>
      <stop offset="0.6" stop-color="#F4521F"/>
      <stop offset="1" stop-color="#FF8C1A"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFE14A"/>
      <stop offset="1" stop-color="#F5A300"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20BDF8"/>
      <stop offset="0.5" stop-color="#1268E6"/>
      <stop offset="0.85" stop-color="#3C55EE"/>
      <stop offset="1" stop-color="#8A5CF6"/>
    </linearGradient>
    <!-- Reflet du verre : coupure nette en diagonale, plus clair vers le haut-droite. -->
    <linearGradient id="glassSheen" x1="0.15" y1="1" x2="0.95" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#E8F7FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="cornerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6FCFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FE3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9B8FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#B07CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="glassClip">
      <path d="M390 478 Q395 445 428 441 L998 362 Q1035 357 1029 393 L957 845 Q951 876 920 881 L343 961 Q307 966 313 930 Z"/>
    </clipPath>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Tuile sombre et son bord lumineux (halo + trait). -->
  <rect x="112" y="100" width="1028" height="1022" rx="210" fill="url(#tile)"/>
  <rect x="112" y="100" width="1028" height="1022" rx="210" fill="url(#tileSheen)"/>
  <g filter="url(#glow)" opacity="0.95">
    <rect x="112" y="100" width="1028" height="1022" rx="210" fill="none" stroke="url(#rimTop)" stroke-width="16" mask="url(#maskTop)"/>
    <rect x="112" y="100" width="1028" height="1022" rx="210" fill="none" stroke="url(#rimBottom)" stroke-width="16" mask="url(#maskBottom)"/>
  </g>
  <rect x="112" y="100" width="1028" height="1022" rx="210" fill="none" stroke="url(#rimTop)" stroke-width="10" mask="url(#maskTop)"/>
  <rect x="112" y="100" width="1028" height="1022" rx="210" fill="none" stroke="url(#rimBottom)" stroke-width="10" mask="url(#maskBottom)"/>

  <!-- Feuilles du dossier, de l'arrière vers l'avant. -->
  <g filter="url(#shadow)">
    <path d="M208 392 Q205 368 232 366 L304 360 L304 945 L285 948 Q268 950 266 932 Z" fill="url(#green)"/>
    <path d="M262 300 Q260 270 292 266 L550 236 Q575 233 590 252 L612 282 Q622 296 640 294 L862 270 Q892 267 894 297 L905 905 L290 940 Z"
          fill="url(#red)"/>
    <path d="M292 266 L550 236 Q575 233 590 252" fill="none" stroke="#FF8F8F" stroke-opacity="0.7" stroke-width="5"/>
    <path d="M300 420 Q298 392 330 388 L815 318 Q846 314 850 345 L860 900 L305 940 Z" fill="url(#yellow)"/>
    <path d="M330 388 L815 318" fill="none" stroke="#FFF6B8" stroke-opacity="0.8" stroke-width="5"/>
  </g>

  <!-- Façade en verre. -->
  <g filter="url(#shadow)">
    <path d="M390 478 Q395 445 428 441 L998 362 Q1035 357 1029 393 L957 845 Q951 876 920 881 L343 961 Q307 966 313 930 Z"
          fill="url(#blue)"/>
  </g>
  <g clip-path="url(#glassClip)">
    <rect x="280" y="330" width="780" height="660" fill="url(#glassSheen)"/>
    <!-- Épaisseur du verre : bande plus claire en bas et à droite, sous un trait intérieur. -->
    <path d="M330 900 L900 800 L962 420 L1040 380 L960 900 L320 990 Z" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="330" cy="950" r="110" fill="url(#cornerGlow)"/>
    <circle cx="955" cy="860" r="120" fill="url(#violetGlow)"/>
  </g>
  <path d="M340 893 L893 796 Q905 794 907 782 L965 420" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
  <path d="M390 478 Q395 445 428 441 L998 362 Q1035 357 1029 393 L957 845 Q951 876 920 881 L343 961 Q307 966 313 930 Z"
        fill="none" stroke="url(#glassRim)" stroke-width="7"/>
</svg>
